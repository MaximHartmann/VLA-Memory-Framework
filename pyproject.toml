[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-memory-framework"
version = "0.1.0"
description = "A framework to incorporate different kinds of knowledge bases and memory into a robotic AI agent built on a vision-language-action (VLA) policy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pillow>=9", "requests>=2.28", "pyyaml>=6"]

[project.optional-dependencies]
proxy = ["websockets>=12", "openpi-client"]   # openpi-client: pip install from the openpi repository (packages/openpi-client)

[project.scripts]
vla-memory-proxy = "vla_memory.planner_loop.cli:main"

[tool.setuptools.packages.find]
include = ["vla_memory*"]

[tool.setuptools.package-data]
vla_memory = ["tasks/*.yaml"]
