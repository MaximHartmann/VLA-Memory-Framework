# Reference task of the framework: a Franka arm, a red and a blue 4 cm cube on a table; pick up and put back the red
# cube, then the blue one. The VLA policy was trained on the four skill strings below (one per frame of the demos).
name: red_blue_blocks
objects: [red, blue]
verbs: ["pick up", "place"]
skill_template: "{verb} the {object} block"
object_field: "{object}_cube"
object_noun: cube
object_states: [on_table, held_lifted, held_at_table, unsure]
max_plan_len: 8            # most skills in one plan (the plan schema's maxItems)

# Completion rule per verb, inserted verbatim into every monitor query (criteria v7, 2026-09-28). The numbers are the
# ones measured on this robot: the hand is 11-13 cm above the table when it grasps or releases a cube, the demos'
# lift ends 24-27 cm up; "pick up" is done at 22 cm (cube about 9 cm up), "place" only after the release AND the
# retreat upwards, because that is where the demo labels switch to the next skill.
criteria:
  "pick up": >-
    Complete only when BOTH hold: (1) the gripper is closed on the {object} cube (closedness >= 0.30; the fingers stop
    on the 4 cm cube at about 0.45) AND (2) the hand is at least 22 cm above the table, i.e. the cube has been lifted
    about 9 cm or more (the hand is only 11-13 cm above the table when it grasps a cube resting on the table). NOT
    complete while the gripper is open, while it is closing down at the table, or while the hand is still below 22 cm
    during the lift.
  "place": >-
    Complete only when ALL THREE hold: (1) the gripper has opened again (closedness < 0.30) after having been closed on
    the {object} cube, (2) the {object} cube rests on the table (it is no longer between the fingers), AND (3) the hand
    has moved back UP away from the cube: hand at least 19 cm above the table (it is only 11-13 cm above the table
    while it releases a cube resting on the table). NOT complete while the cube is still held, while it is being
    lowered, or while the open hand is still down at the cube.

system_head: >-
  You are the task monitor of a robot arm: a Franka Panda with a two-finger parallel gripper, working on a table with
  a red cube and a blue cube (4 cm). The robot executes one skill at a time from a fixed plan. Judge only from the
  images; be conservative: when in doubt, the skill is not yet complete. Answer with JSON only.
system_ext: >-
  You receive one image from a fixed external camera that sees the table, both cubes and the arm. A cube is 'held'
  only if it is between the gripper fingers and moves with the hand; a lifted cube is clearly above the table
  surface, with visible space between the cube and the table.
system_both: >-
  You receive two images. Picture 1 is a fixed external camera that sees the table, both cubes and the arm from the
  side: use it to judge where the cubes are and whether a cube is lifted (a lifted cube hangs under the hand with
  visible space between it and the table); the hand can partly hide a held cube from this camera. Picture 2 is the
  wrist camera on the hand, looking forward and down between the fingers. HOW TO READ PICTURE 2: the lower 45% of
  Picture 2 is always covered by the gripper's own light-grey housing, a flat band across the full width, and the two
  finger pads are always visible as small dark-grey blocks on the top edge of that band, one at the left and one at
  the right. (a) A cube HELD between the fingers is an upright, complete coloured square in the CENTRE of Picture 2,
  about two fifths of the picture wide, its lower edge resting on the housing band, with both finger pads touching its
  left and right sides. A held cube looks the same at every height because it moves with the camera: Picture 2 cannot
  show whether it has been lifted; take the height from the proprioception (hand height) and from Picture 1. (b) A
  cube resting on the table right below a LOW, OPEN gripper (just before a grasp, or just after a release while the
  hand is still down) also fills the centre of Picture 2 and can look like (a). The differences: the open finger pads
  stand apart from the cube, with table visible between each pad and the side of the cube (after a release the cube
  is often also tilted or shifted); the proprioception reports the gripper open (closedness below 0.30); Picture 1
  shows the cube resting on the table. (c) If the gripper is closed but no upright square sits between the pads (the
  cube lies tilted across a pad, is pushed to one side, or shows only as a thin strip, or not at all, at the top edge
  of the housing), the grasp missed and the cube is NOT held, although the gripper reads closed: the closedness is
  about the same whether the fingers closed on the cube or beside it. (d) A cube on the table seen from higher up is a
  smaller square, often tilted, in the upper part of Picture 2 above the finger pads; it shrinks and moves up as the
  hand rises, for example while the hand moves away after placing it. (e) An empty gripper high above the table shows
  the table surface, possibly with one or two small cubes far away.
plan_system: >-
  You decompose a natural-language instruction for a single robot arm into an ordered list of skills. The arm knows
  exactly these skills and nothing else: {skills}. 'pick up the X block' grasps the X cube and lifts it; 'place the X
  block' puts the held X cube back on the table and releases it. A cube that was picked up must be placed before
  another cube is picked up, and the task always ends with the arm empty: every cube that is picked up is placed back
  before the end, even when the instruction does not say so explicitly. Output the skills in the order the
  instruction requires.

# Proprioception sentence: the gripper counts as closed above this closedness; the note is appended to the height.
proprio:
  closed_threshold: 0.30
  history: 12
  note: "the hand is 11-13 cm above the table when it grasps or releases a cube resting on the table"
  # What the gripper signals mean, for the rules writer of the history-appended prompt (robot, not task):
  open_width: 0.06          # m, both fingers together; wider = open (fully open 0.08, closed on a cube 0.037)
  empty_width: 0.015        # m, narrower = closed on nothing
  squeeze_force: 8.0        # finger force (N) above which the fingers hold something; about 27 on a cube in the simulator.
                            # A closed empty gripper stops at its commanded width (0.032 here) without force, so the force,
                            # not the width, rejects empty grasps. For a gripper that reports a grasped flag (1/0): 0.5.

# Retrieval key of the exemplar store: colour thumbnail + blob statistics of each object colour, per camera.
# A colour rule is a list of [channel_a, channel_b, min_difference] conditions on the RGB values (all must hold).
fingerprint:
  thumbnail: [12, 16]
  w_thumb: 1.0
  w_blob: 6.0
  colours:
    red:  [[r, g, 60], [r, b, 60]]
    blue: [[b, r, 40], [b, g, 15]]

# How the demonstrations of THIS task are labelled for the exemplar store (labels.PhaseLabeller): the demo generator
# stores a waypoint phase per frame; each object has a close/lift/lower/open phase, and the phases map to skills.
demo_phases:
  phase_to_skill: {"0-3": 0, "4-6": 1, "7-11": 2, "12-14": 3}
  per_object:
    red:  {close: 2, lift: 3, lower: 4, open: 5}
    blue: {close: 10, lift: 11, lower: 12, open: 13}
  high_phases: [0, 7, 8]          # hand high above the table for the whole phase
  low_phases: [2, 5, 10, 13]      # hand down at the table
  rising_phases: [3, 6, 11, 14]   # hand high in the second half of the phase; other phases: high in the first half

# History-appended prompt (method 2): the text appended to the unchanged instruction, one past-tense phrase per
# completed skill, e.g. "... History: picked up the red block, placed the red block." The reference policy of that
# method was trained on exactly these strings (empty history: "History: none yet.").
history:
  prefix: " History: "
  none: "none yet"
  events: {"pick up": "picked up the {object} block", "place": "placed the {object} block"}
  joiner: ", "
  suffix: "."
  max_lines: 3              # the longest history in the training data (the last state lists three events)
  # Rules writer (history_appended.rules): when a line is written, from the robot's own signals. Each verb maps to one
  # trigger of the grasp cycle. The numbers reproduce the moments where the training labels change, the same rules as the
  # simulator's ground-truth tracker: "pick up" once the block is 9 cm up, "place" once the fingertips are 6 cm above or
  # 8 cm away from the set-down block. A block let go less than 8 cm above the grasp point counts as set down.
  rules:
    pick up: {trigger: lift, rise: 0.09}
    place:   {trigger: set_down, release_below: 0.08, up: 0.06, away: 0.08}
  # Which object a pick concerns (history_appended.identify): plan_order assumes the plan; colour counts each object's colour
  # (fingerprint.colours) in the wrist-image region where a held object appears (rows, cols as fractions; measured on the
  # demonstrations: a held block fills a median 82 % of it, the other block's colour never appears). On 957 recorded picks
  # with a lifted block the colour identifier named every one correctly, including 31 blue-first picks the plan order gets wrong.
  object_from: colour
  held_region: [0.30, 0.60, 0.33, 0.67]
  held_min_share: 0.12

instruction_examples:
  - "Pick up the red block with your arm, place it back, and then grasp the blue block."
  - "First, grasp the red block and put it back down. After that, pick up the blue block."
  - "Lift the red block, place it down, and then pick up the blue block."
  - "Grab the red block, return it to the table, and proceed to pick up the blue block."
  - "Take the red block, put it down, and grab the blue block."
